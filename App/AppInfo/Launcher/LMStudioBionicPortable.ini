[Launch]
ProgramExecutable=LMStudioBionic\Bionic.exe
DirectoryMoveOK=yes
SupportsUNC=yes
CleanTemp=false
SinglePortableAppInstance=true
WaitForProgram=true

[Activate]
Registry=true

[DirectoriesMove]
AppData=%APPDATA%\Bionic
LocalAppData=%LOCALAPPDATA%\Bionic
DotLMStudio=%USERPROFILE%\.lmstudio
DotCache=%USERPROFILE%\.cache\lm-studio

[FilesMove]
.lmstudio-home-pointer=%USERPROFILE%

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Bionic
2=%LOCALAPPDATA%\Bionic
